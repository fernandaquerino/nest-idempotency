name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, do not use this form: follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A link to a repository, or the smallest module, controller and requests (for example curl
        commands) that show the problem.
      render: ts
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: nest-idempotency version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: nest-version
    attributes:
      label: NestJS version
      placeholder: 11.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.12.0
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage adapter
      options:
        - RedisIdempotencyStorage
        - MemoryIdempotencyStorage
        - Custom adapter
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
