name: Release

# On every push to main, Changesets either opens (or updates) a "Version Packages" pull request
# from the pending changesets, or, when that pull request has just been merged and there is
# nothing left to version, publishes the new version to npm with provenance.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and tags
      pull-requests: write # open the Version Packages pull request
      id-token: write # npm provenance
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Start Redis
        run: docker compose up -d --wait redis

      - name: Quality gates
        run: npm run check

      - name: Create the version pull request or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Stop Redis
        if: always()
        run: docker compose down
